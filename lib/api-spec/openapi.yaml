openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: radar
    description: RADAR support team operations
  - name: students
    description: Protected student record management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Checks both the API process and its PostgreSQL connection
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List student records
      responses:
        "200":
          description: Student records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentRecord"
        "401":
          description: Sign-in is required
        "403":
          description: Support team access is required
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a student record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRecord"
        "400":
          description: Invalid student data
        "401":
          description: Sign-in is required
        "403":
          description: Support team access is required
        "409":
          description: Student number already exists
  /students/import:
    post:
      operationId: importStudents
      tags: [students]
      summary: Validate, preprocess, and import student CSV data
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "201":
          description: Validated student data imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentImportResult"
        "400":
          description: CSV file is missing or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in is required
        "403":
          description: Support team access is required
        "413":
          description: CSV file exceeds the upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: CSV columns or rows do not pass validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentImportValidationError"
  /students/{studentId}:
    parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getStudent
      tags: [students]
      summary: Get one student record
      responses:
        "200":
          description: Student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRecord"
        "400":
          description: Invalid student ID
        "401":
          description: Sign-in is required
        "403":
          description: Support team access is required
        "404":
          description: Student not found
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRecord"
        "400":
          description: Invalid student data
        "401":
          description: Sign-in is required
        "403":
          description: Support team access is required
        "404":
          description: Student not found
        "409":
          description: Student number already exists
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student record without linked history
      responses:
        "204":
          description: Student deleted
        "400":
          description: Invalid student ID
        "401":
          description: Sign-in is required
        "403":
          description: Support team access is required
        "404":
          description: Student not found
        "409":
          description: Linked academic or support history prevents deletion
  /radar/access:
    get:
      operationId: getRadarAccess
      tags: [radar]
      summary: Verify support team access
      responses:
        "200":
          description: The authenticated user's support role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarAccess"
        "401":
          description: Sign-in is required
        "403":
          description: The account is not authorized for RADAR
  /radar/invitations:
    get:
      operationId: listRadarInvitations
      tags: [radar]
      summary: List pending support team invitations
      responses:
        "200":
          description: Pending support invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarInvitation"
        "401":
          description: Sign-in is required
        "403":
          description: Support administrator access is required
    post:
      operationId: createRadarInvitation
      tags: [radar]
      summary: Invite a support team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRadarInvitation"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarInvitation"
        "400":
          description: Invalid invitation request
        "401":
          description: Sign-in is required
        "403":
          description: Support administrator access is required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [connected]
      required: [status, database]
    HealthError:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        database:
          type: string
          enum: [disconnected]
        message:
          type: string
      required: [status, database, message]
    StudentRecord:
      type: object
      properties:
        id:
          type: integer
        studentNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: [string, "null"]
        age:
          type: [integer, "null"]
        faculty:
          type: [string, "null"]
        programme:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - studentNumber
        - firstName
        - lastName
        - email
        - age
        - faculty
        - programme
        - createdAt
    StudentInput:
      type: object
      properties:
        studentNumber:
          type: string
          minLength: 1
          maxLength: 50
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
        age:
          type: [integer, "null"]
          minimum: 0
          maximum: 130
        faculty:
          type: [string, "null"]
          maxLength: 150
        programme:
          type: [string, "null"]
          maxLength: 150
      required: [studentNumber, firstName, lastName]
    StudentUpdate:
      type: object
      properties:
        studentNumber:
          type: string
          minLength: 1
          maxLength: 50
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
        age:
          type: [integer, "null"]
          minimum: 0
          maximum: 130
        faculty:
          type: [string, "null"]
          maxLength: 150
        programme:
          type: [string, "null"]
          maxLength: 150
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    StudentImportResult:
      type: object
      properties:
        rowsReceived:
          type: integer
        importedStudents:
          type: integer
        duplicateRowsRemoved:
          type: integer
        existingStudentsSkipped:
          type: integer
        missingValues:
          type: array
          items:
            $ref: "#/components/schemas/StudentMissingValueCount"
        featureColumns:
          type: array
          items:
            type: string
        preparedFeatureRows:
          type: integer
        imputedFeatures:
          type: array
          items:
            $ref: "#/components/schemas/StudentFeatureImputation"
      required:
        - rowsReceived
        - importedStudents
        - duplicateRowsRemoved
        - existingStudentsSkipped
        - missingValues
        - featureColumns
        - preparedFeatureRows
        - imputedFeatures
    StudentImportValidationError:
      type: object
      properties:
        error:
          type: string
        rowsReceived:
          type: integer
        duplicateRowsRemoved:
          type: integer
        missingValues:
          type: array
          items:
            $ref: "#/components/schemas/StudentMissingValueCount"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/StudentImportIssue"
      required: [error, rowsReceived, duplicateRowsRemoved, missingValues, issues]
    StudentImportIssue:
      type: object
      properties:
        row:
          type: integer
          minimum: 1
        column:
          type: string
        message:
          type: string
      required: [row, column, message]
    StudentMissingValueCount:
      type: object
      properties:
        column:
          type: string
        count:
          type: integer
          minimum: 0
      required: [column, count]
    StudentFeatureImputation:
      type: object
      properties:
        column:
          type: string
        missingCount:
          type: integer
          minimum: 0
        imputationValue:
          type: number
      required: [column, missingCount, imputationValue]
    CreateRadarInvitation:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    RadarInvitation:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - status
        - createdAt
    RadarAccess:
      type: object
      properties:
        role:
          type: string
          enum: [support_admin, support_member]
      required:
        - role

